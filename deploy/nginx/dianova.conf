# /etc/nginx/sites-available/dianova.conf
# Frontend React como build estático + API Spring Boot detrás de /api.
# Certbot (python3-certbot-nginx) agrega el bloque HTTPS y la redirección
# automáticamente al ejecutar:  sudo certbot --nginx -d TU-DOMINIO -d www.TU-DOMINIO

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO www.TU-DOMINIO;

    root /var/www/dianova;
    index index.html;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # API REST (JAR de Spring Boot escuchando solo en localhost:8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
