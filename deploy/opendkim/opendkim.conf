# /etc/opendkim.conf (fragmento relevante)
# Firma con DKIM los correos que Postfix envía desde el VPS.
Syslog                  yes
UMask                   007
Canonicalization        relaxed/simple
Mode                    sv
SubDomains              no
OversignHeaders         From
AutoRestart             yes
Socket                  inet:8891@localhost
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim
KeyTable                /etc/opendkim/key.table
SigningTable            refile:/etc/opendkim/signing.table
ExternalIgnoreList      /etc/opendkim/trusted.hosts
InternalHosts           /etc/opendkim/trusted.hosts

# /etc/opendkim/key.table
#   default._domainkey.TU-DOMINIO TU-DOMINIO:default:/etc/opendkim/keys/TU-DOMINIO/default.private
# /etc/opendkim/signing.table
#   *@TU-DOMINIO default._domainkey.TU-DOMINIO
# /etc/opendkim/trusted.hosts
#   127.0.0.1
#   localhost
#   TU-DOMINIO
