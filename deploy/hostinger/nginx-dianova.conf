# Sitio de Nginx para Dianova (lo instala deploy/hostinger/instalar.sh).
# __DOMINIO__ y __PUERTO__ se reemplazan al instalar. Convive con los demás
# sitios del VPS porque solo responde a su propio server_name.
# Certbot agrega el bloque HTTPS y la redirección al ejecutar:
#   certbot --nginx -d __DOMINIO__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # Build estático de React
    root /var/www/dianova;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    access_log /var/log/nginx/dianova.access.log;
    error_log /var/log/nginx/dianova.error.log;

    # API REST: JAR de Spring Boot escuchando solo en 127.0.0.1
    location /api/ {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sin caché para que cada despliegue se vea al instante
    # (add_header dentro de un location reemplaza a los del server: se repiten)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: cualquier otra ruta la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
